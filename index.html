<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta
          name="description"
          content="Small application for my wife"
  />
  <title>React App</title>
</head>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    animation: breathe 20s ease-in-out infinite alternate;
  }

  /* Картинка в родном размере 600x350, масштаб под экран (как cover) задает скрипт */
  .photo {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 600px;
    height: 350px;
    background-image: url("vyahir-3.jpg");
    transform: translate(-50%, -50%) scale(var(--cover, 1));
  }

  /* Веко лежит над глазом в координатах картинки */
  .eyelid {
    position: absolute;
    left: 276px;
    top: 47px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    filter: blur(1.5px);
  }

  .eyelid::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 20% at 50% 72%, rgba(35, 40, 55, 0.55), transparent 70%),
      radial-gradient(circle at 45% 30%, rgb(104, 121, 154), rgb(80, 92, 122) 75%);
    transform: scaleY(0);
    transform-origin: top;
  }

  .eyelid.blink::before {
    animation: blink 0.22s ease-in-out;
  }

  @keyframes blink {
    0%, 100% {
      transform: scaleY(0);
    }
    45%, 55% {
      transform: scaleY(1);
    }
  }

  div.middle-div {
    position: relative;
    top: 50%;
    -webkit-transform: translateY(-50%);
    -ms-transform: translateY(-50%);
    transform: translateY(-50%);
    padding: 0 16px;
    box-sizing: border-box;
    max-width: 100%;
    text-align: center;
    animation: appear 1.8s ease-out both;
  }

  @keyframes appear {
    from {
      opacity: 0;
      translate: 0 20px;
      filter: blur(4px);
    }
    to {
      opacity: 1;
      translate: 0 0;
      filter: blur(0);
    }
  }

  @keyframes breathe {
    from {
      transform: scale(1);
    }
    to {
      transform: scale(1.08);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene,
    div.middle-div {
      animation: none;
    }
  }

  .container {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50%;
    font-size: 24px;
    color: aliceblue;
    text-shadow: 2px 2px 8px #000000;
  }

  body,
  html {
    height: 100%;
  }
</style>
<body>
<div class="scene">
  <div class="photo">
    <div class="eyelid" id="eyelid"></div>
  </div>
</div>
<div class="container">
  <div id="eutiroks" class="middle-div"></div>
</div>
<script>
  const startDate = new Date('2025-03-16T12:00:00')
  const startValue = 75
  function appendText(text) {
    document.getElementById("eutiroks").innerText = text
  }
  function getRandomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function getMessage(doze) {
    let messages = [
            "Для того чтобы сегодня был хороший день нужно выпить #doze мг эутирокса",
            "Настя, ты самая красивая, я тебя очень люблю, было бы здорово если б ты выпила сегодня #doze мг эутирокса",
            "Настя, ты кукушка, выпей #doze мг эутирокса",
            "Наверное ты бы с удовольствием начала утро с завтрака в макдаке, но придется сначала выпить #doze мг эутирокса",
      "Настюшка Настюшка зачем ты съела а потом запила #doze мг эутирокса",
      "Вопрос из разряда геральдики, что ты выберешь - пукать беззвучно или #doze мг эутирокса?",
      "Настя, у тебя все получится, ты умник, но выпей #doze мг эутирокса",
      "Утро у Настюшки начинается не с кофе и не с коньяка, и не с пива, и не с вина, а с #doze мг эутирокса",
      "Я ему раз сказала - он не понимает, я ему два сказала - он не понимает, а вот выпил бы #doze мг эутирокса - все бы с первого раза понял",
      "Самой лучшей жене нужно выпить #doze мг эутирокса",
      "Вопрос из разряда геральдики, если бы ты была кассиром ты бы выпила #doze мг эутирокса?",
      "Желаю тебе доброго утра и выпить #doze мг эутирокса",
      "Кукушкин дом это место где живут кукушки, а тебе нужно #doze мг эутирокса",
      "Тебе пора вставать и выпить #doze мг эутирокса",
      "Ты очень смелая раз каждое утро смотришь на птицу ради #doze мг эутирокса",
      "Большой голубь следит за тобой, выпей пожалуйста #doze мг эутирокса",
      "Настя, голубь тебя не любит, но все равно пришел напомнить про #doze мг эутирокса",
      "Вопрос из разряда геральдики, что страшнее - голубь на весь экран или забыть выпить #doze мг эутирокса?",
      "Настюшка не боится голубей, Настюшка просто уважительно держит дистанцию и пьет #doze мг эутирокса",
      "Голубь моргнул - значит пора выпить #doze мг эутирокса, если не выпьешь он моргнет еще раз",
      "Хочешь чтобы голубь исчез с экрана? Есть только один способ - #doze мг эутирокса",
      "Биг Мак, картошка фри, кола и #doze мг эутирокса, но эутирокс первым и натощак",
      "Настя, море никуда не денется, макдак тоже, а вот #doze мг эутирокса надо выпить прямо сейчас",
      "Вопрос из разряда геральдики, если бы на море были голуби вместо чаек ты бы поехала? Сначала выпей #doze мг эутирокса",
    ]
    let random = getRandomInt(0, messages.length - 1)
    let message = messages[random]
    return message.replace("#doze", doze)
  }

  function getCurrentDoze() {
    let today = new Date()
    today.setHours(12,0,0,0)
    startDate.setHours(12,0,0,0)
    let difference = today.getTime() -  startDate.getTime();
    let days = Math.round(difference / (1000 * 3600 * 24));
    let doze = 0
    if (days === 0) {
      doze = startValue
    } else if (days === 1) {
      doze = 50
    } else if (days % 2 === 0) {
      doze = 75
    } else {
      doze = 50
    }

    return doze
  }
  appendText(getMessage(getCurrentDoze()))

  const photoWidth = 600
  const photoHeight = 350
  const blinkClass = "blink"
  const eyelid = document.getElementById("eyelid")

  function fitPhoto() {
    let cover = Math.max(window.innerWidth / photoWidth, window.innerHeight / photoHeight)
    document.documentElement.style.setProperty("--cover", cover)
  }

  function scheduleBlink() {
    setTimeout(function () {
      eyelid.classList.add(blinkClass)
    }, getRandomInt(2500, 6000))
  }

  eyelid.addEventListener("animationend", function () {
    eyelid.classList.remove(blinkClass)
    scheduleBlink()
  })

  fitPhoto()
  window.addEventListener("resize", fitPhoto)
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    scheduleBlink()
  }

</script>
</body>
</html>
